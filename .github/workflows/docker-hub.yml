name: Publish Docker images

on:
  push:
    tags: ['**']

permissions:
  contents: read

# Do not interrupt a push halfway through or let two runs update latest at once.
concurrency:
  group: docker-hub-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILDER_NAME: purels-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate image version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || \
             [[ "$RELEASE_TAG" == latest || "$RELEASE_TAG" == sha-* ]]; then
            echo "Git tag must be a valid Docker tag and cannot be latest or start with sha-." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: puremixai
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up CPU emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Create an isolated builder
        run: docker buildx create --name "$BUILDER_NAME" --driver docker-container --bootstrap

      - name: Build and push API and worker image
        run: |
          docker buildx build --builder "$BUILDER_NAME" --platform linux/amd64,linux/arm64 \
            --tag "puremixai/purels-api:sha-${GITHUB_SHA}" \
            --push .

      - name: Build and push web image
        run: |
          docker buildx build --builder "$BUILDER_NAME" --platform linux/amd64,linux/arm64 \
            --build-arg API_PROXY_TARGET=http://api:8080 \
            --tag "puremixai/purels-web:sha-${GITHUB_SHA}" \
            --push ./web

      # Publish version and latest only after both commit-specific images exist.
      - name: Publish version and latest tags
        run: |
          docker buildx imagetools create --builder "$BUILDER_NAME" \
            --tag "puremixai/purels-api:${RELEASE_TAG}" \
            --tag puremixai/purels-api:latest "puremixai/purels-api:sha-${GITHUB_SHA}"
          docker buildx imagetools create --builder "$BUILDER_NAME" \
            --tag "puremixai/purels-web:${RELEASE_TAG}" \
            --tag puremixai/purels-web:latest "puremixai/purels-web:sha-${GITHUB_SHA}"

      - name: Update API image description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: puremixai
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          repository: puremixai/purels-api
          short-description: API and worker for Purels, a self-hosted URL shortener with link analytics.
          readme-filepath: ./docs/docker-hub-api.md

      - name: Update Web image description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: puremixai
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
          repository: puremixai/purels-web
          short-description: Web console for Purels, a self-hosted URL shortener with link analytics.
          readme-filepath: ./docs/docker-hub-web.md

      # --push exports directly to Docker Hub; it does not load images into the
      # runner's image store. Removing this builder also removes its BuildKit
      # container and cache volume, including when a build fails or is cancelled.
      - name: Remove build resources
        if: always()
        run: |
          if docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            docker buildx rm --force "$BUILDER_NAME"
          fi
